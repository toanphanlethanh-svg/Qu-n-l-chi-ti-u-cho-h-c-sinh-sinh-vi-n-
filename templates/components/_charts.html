<div class="row mb-4">
    {% if is_over_budget %}
    <div class="col-12 mb-3">
        <div class="alert alert-danger d-flex align-items-center shadow-sm" role="alert">
            <span class="fs-4 me-2">⚠️</span>
            <div>
                <strong>CẢNH BÁO CHI TIÊU QUÁ ĐÀ!</strong> 
                Bạn đã tiêu <strong>{{ "{:,.0f}".format(total_expense) }} VNĐ</strong>, vượt hạn mức <strong>{{ "{:,.0f}".format(monthly_budget) }} VNĐ</strong>!
            </div>
        </div>
    </div>
    {% endif %}

    <div class="col-md-6 mb-3">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="m-0">Hạn Mức Chi Tiêu Tháng</h5>
                <form action="/" method="GET" class="d-flex align-items-center">
                    <input type="number" name="monthly_budget" value="{{ monthly_budget }}" class="form-control form-control-sm me-2" style="width: 110px;">
                    <button type="submit" class="btn btn-sm btn-outline-light">Sửa</button>
                </form>
            </div>
            <div class="card-body text-center">
                <canvas id="budgetChart" style="max-height: 250px;"></canvas>
            </div>
        </div>
    </div>

    <div class="col-md-6 mb-3">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-dark text-white">
                <h5 class="m-0">Tiến Độ Chi Tiêu 6 Hũ</h5>
            </div>
            <div class="card-body">
                <canvas id="jarsBarChart" style="max-height: 250px;"></canvas>
            </div>
        </div>
    </div>
</div>
